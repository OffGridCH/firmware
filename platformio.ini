[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D OFFGRID_MOCK_DEVICE=1
    -D RADIOLIB_DEBUG_PORT=Serial0
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0

lib_deps =
    bblanchon/ArduinoJson@6.21.5
    jgromes/RadioLib@7.8.1

[env:serial_mock_usb]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D OFFGRID_SERIAL_NATIVE_USB=1

[env:radio_diag]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D OFFGRID_RADIO_DIAGNOSTICS=1

[env:radio_diag_usb]
extends = env:radio_diag
build_flags =
    ${env:radio_diag.build_flags}
    -D OFFGRID_SERIAL_NATIVE_USB=1